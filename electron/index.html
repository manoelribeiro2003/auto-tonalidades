<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Auto Tonalidades</title>

    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", sans-serif;
        background: #f5f6fa;
        color: #2d2f78;
      }

      main {
        text-align: center;
        padding: 32px;
      }

      h1 {
        margin-bottom: 8px;
      }

      p {
        color: #667085;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Auto Tonalidades</h1>
      <p>Aplicativo iniciado com Electron e TypeScript.</p>
    </main>
  </body>
</html>
